kind = "web"
previewPath = "/"
title = "Decoration Kingdom"
version = "1.0.0"
id = "artifacts/decoration-kingdom"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 5173

[services.development]
run = "pnpm --filter @workspace/decoration-kingdom run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/decoration-kingdom", "run", "build" ]
serve = "static"
publicDir = "artifacts/decoration-kingdom/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "5173"
BASE_PATH = "/"
